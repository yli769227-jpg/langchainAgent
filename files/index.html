<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangChain Agent · 智能助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07071a;
    --surface: #0e0e2a;
    --border: #1a1a40;
    --border-bright: #2e2e60;
    --blue: #4f8ef7;
    --purple: #9b6dff;
    --blue-dim: rgba(79,142,247,0.12);
    --purple-dim: rgba(155,109,255,0.12);
    --glow-blue: rgba(79,142,247,0.25);
    --glow-purple: rgba(155,109,255,0.25);
    --text: #dde2ff;
    --text-dim: #6b72b0;
    --text-muted: #2e3260;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Outfit', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Animated mesh background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,109,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(79,142,247,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(155,109,255,0.08) 0%, transparent 70%),
      radial-gradient(ellipse at center, transparent 30%, rgba(7,7,26,0.85) 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== LOGIN SCREEN ===== */
  #login-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  #login-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(155,109,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }

  #login-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 30% 30%, rgba(79,142,247,0.1) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 70% 70%, rgba(155,109,255,0.1) 0%, transparent 60%);
  }

  .login-box {
    position: relative;
    z-index: 1;
    width: 380px;
    padding: 48px 40px;
    background: rgba(14,14,42,0.85);
    border: 1px solid var(--border-bright);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px rgba(155,109,255,0.1),
      0 40px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
    animation: loginAppear 0.6s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes loginAppear {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .login-hexagon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-hexagon svg {
    width: 56px;
    height: 56px;
    position: absolute;
  }

  .login-hexagon .hex-bg {
    stroke: url(#hexGrad);
    fill: rgba(79,142,247,0.08);
    stroke-width: 1.5;
    filter: drop-shadow(0 0 8px rgba(155,109,255,0.4));
  }

  .login-hexagon .hex-inner {
    position: relative;
    z-index: 1;
    font-size: 22px;
  }

  .login-title {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .login-field {
    margin-bottom: 20px;
  }

  .login-label {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }

  .login-input-wrap {
    position: relative;
  }

  .login-input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(7,7,26,0.6);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.15em;
    outline: none;
    transition: all 0.25s;
  }

  .login-input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(155,109,255,0.15), 0 0 20px rgba(155,109,255,0.1);
  }

  .login-input.error {
    border-color: #ff5f7e;
    box-shadow: 0 0 0 3px rgba(255,95,126,0.15);
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .login-input::placeholder { color: var(--text-muted); letter-spacing: 0.05em; }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .login-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .login-btn:hover::before { opacity: 1; }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(155,109,255,0.35); }
  .login-btn:active { transform: translateY(0); }

  .login-error {
    margin-top: 12px;
    font-size: 11px;
    color: #ff5f7e;
    text-align: center;
    letter-spacing: 0.05em;
    min-height: 16px;
  }

  /* Success state */
  .login-box.success {
    animation: successPulse 0.5s ease;
  }

  @keyframes successPulse {
    0% { box-shadow: 0 0 0 1px rgba(155,109,255,0.1), 0 40px 80px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 0 4px rgba(79,142,247,0.4), 0 0 60px rgba(155,109,255,0.3); }
    100% { box-shadow: 0 0 0 1px rgba(155,109,255,0.1), 0 40px 80px rgba(0,0,0,0.5); }
  }

  .login-success-msg {
    display: none;
    text-align: center;
    padding: 16px 0 0;
    font-size: 12px;
    color: var(--blue);
    letter-spacing: 0.08em;
    animation: fadeUp 0.4s ease;
  }

  /* ===== HEADER ===== */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(7,7,26,0.9);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
    border: 1px solid var(--purple);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--purple-dim);
    box-shadow: 0 0 12px rgba(155,109,255,0.2);
  }

  .logo-icon svg {
    width: 16px; height: 16px;
    stroke: var(--purple); fill: none; stroke-width: 1.5;
  }

  .logo-title {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--blue), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.06em;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* FREE badge */
  .free-badge {
    position: relative;
    padding: 5px 14px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--blue);
    border: 1px solid rgba(79,142,247,0.4);
    border-radius: 20px;
    background: rgba(79,142,247,0.08);
    overflow: hidden;
  }

  .free-badge::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s infinite;
  }

  @keyframes shimmer {
    0% { left: -60%; }
    100% { left: 160%; }
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }

  .status-dot.active {
    background: var(--blue);
    box-shadow: 0 0 6px var(--blue);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== MAIN ===== */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 10%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 60px 20px 40px;
    animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Big FREE display */
  .welcome-free {
    position: relative;
    display: inline-block;
    margin-bottom: 32px;
  }

  .free-text {
    font-family: var(--sans);
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #4f8ef7 0%, #9b6dff 50%, #4f8ef7 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    letter-spacing: -0.02em;
    filter: drop-shadow(0 0 40px rgba(155,109,255,0.3));
  }

  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .free-glow {
    position: absolute;
    inset: -20px;
    background: radial-gradient(ellipse at center, rgba(155,109,255,0.15) 0%, transparent 70%);
    pointer-events: none;
    animation: glowPulse 3s ease infinite;
  }

  @keyframes glowPulse {
    0%,100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .free-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: 20px;
    font-size: 10px;
    color: var(--blue);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    background: rgba(79,142,247,0.06);
    margin-bottom: 24px;
  }

  .free-tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--blue);
    animation: pulse 2s infinite;
  }

  .welcome-title {
    font-family: var(--sans);
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .welcome-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 32px;
    letter-spacing: 0.04em;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 560px;
    margin: 0 auto;
  }

  .suggestion-chip {
    padding: 8px 16px;
    border: 1px solid var(--border-bright);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(14,14,42,0.6);
  }

  .suggestion-chip:hover {
    border-color: var(--purple);
    color: var(--purple);
    background: var(--purple-dim);
    box-shadow: 0 0 12px rgba(155,109,255,0.15);
  }

  /* Messages */
  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .avatar.user {
    background: var(--purple-dim);
    border-color: var(--purple);
    box-shadow: 0 0 8px rgba(155,109,255,0.2);
  }

  .avatar.agent {
    background: var(--blue-dim);
    border-color: var(--blue);
    box-shadow: 0 0 8px rgba(79,142,247,0.2);
  }

  .message-body { flex: 1; }
  .message.user .message-body { text-align: right; }

  .message-meta {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .message-bubble {
    display: inline-block;
    max-width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.65;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message.user .message-bubble {
    background: linear-gradient(135deg, rgba(155,109,255,0.2), rgba(79,142,247,0.15));
    border: 1px solid rgba(155,109,255,0.35);
    border-radius: 10px 2px 10px 10px;
  }

  .message.agent .message-bubble {
    background: rgba(14,14,42,0.7);
    border: 1px solid var(--border-bright);
    border-radius: 2px 10px 10px 10px;
  }

  /* Tool steps */
  .tool-steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }

  .tool-step {
    padding: 10px 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .tool-step-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .tool-step-name { color: var(--blue); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .tool-step-input { color: var(--text-muted); font-size: 10px; }
  .tool-step-output { color: var(--text-dim); margin-top: 4px; }

  /* Thinking */
  .thinking {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(14,14,42,0.7);
    border: 1px solid var(--border-bright);
    border-radius: 2px 10px 10px 10px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .thinking-dots { display: flex; gap: 4px; }

  .thinking-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--purple);
    animation: dot-bounce 1.2s infinite;
  }

  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%,80%,100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 20px 10%;
    border-top: 1px solid var(--border);
    background: rgba(7,7,26,0.9);
    backdrop-filter: blur(12px);
  }

  .input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 800px;
    margin: 0 auto;
    padding: 12px 16px;
    border: 1px solid var(--border-bright);
    border-radius: 14px;
    background: rgba(14,14,42,0.8);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(155,109,255,0.1), 0 0 20px rgba(155,109,255,0.08);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    resize: none;
    min-height: 22px;
    max-height: 120px;
    overflow-y: auto;
  }

  #user-input::placeholder { color: var(--text-muted); }
  #user-input::-webkit-scrollbar { width: 3px; }
  #user-input::-webkit-scrollbar-thumb { background: var(--border-bright); }

  .send-btn {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(155,109,255,0.3);
  }

  .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(155,109,255,0.45); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

  .send-btn svg { width: 15px; height: 15px; stroke: white; fill: none; stroke-width: 2; }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .input-hint { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 280px;
    border-left: 1px solid var(--border);
    background: rgba(7,7,26,0.95);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-btn {
    padding: 5px 10px;
    background: var(--purple-dim);
    border: 1px solid rgba(155,109,255,0.4);
    border-radius: 6px;
    color: var(--purple);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sidebar-btn:hover { background: rgba(155,109,255,0.2); }

  .sidebar-body { flex: 1; overflow-y: auto; padding: 12px; }
  .sidebar-body::-webkit-scrollbar { width: 3px; }
  .sidebar-body::-webkit-scrollbar-thumb { background: var(--border-bright); }

  .kb-card {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(14,14,42,0.5);
  }
  .kb-card:hover { border-color: var(--purple); background: var(--purple-dim); }
  .kb-card.active { border-color: var(--purple); background: var(--purple-dim); box-shadow: 0 0 8px rgba(155,109,255,0.15); }

  .kb-card-name { font-size: 12px; color: var(--text); margin-bottom: 3px; }
  .kb-card-meta { font-size: 10px; color: var(--text-dim); display: flex; justify-content: space-between; }

  .kb-card-actions { display: flex; gap: 6px; margin-top: 8px; }
  .kb-action-btn {
    flex: 1;
    padding: 4px 0;
    font-size: 10px;
    font-family: var(--mono);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .kb-action-btn.add { background: var(--blue-dim); border: 1px solid rgba(79,142,247,0.3); color: var(--blue); }
  .kb-action-btn.add:hover { background: rgba(79,142,247,0.2); }
  .kb-action-btn.del { background: rgba(255,95,126,0.08); border: 1px solid rgba(255,95,126,0.3); color: #ff5f7e; }
  .kb-action-btn.del:hover { background: rgba(255,95,126,0.15); }

  .kb-active-bar {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kb-active-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); flex-shrink: 0; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    animation: fadeUp 0.25s ease;
  }
  .modal-title { font-size: 14px; color: var(--text); margin-bottom: 18px; font-family: var(--sans); font-weight: 600; }
  .modal-input {
    width: 100%;
    padding: 10px 12px;
    background: rgba(7,7,26,0.6);
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .modal-input:focus { border-color: var(--purple); }
  .modal-textarea { min-height: 100px; resize: vertical; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .modal-cancel {
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
  }
  .modal-confirm {
    padding: 8px 18px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    right: 24px;
    padding: 12px 18px;
    background: rgba(14,14,42,0.95);
    border: 1px solid var(--blue);
    border-radius: 10px;
    font-size: 12px;
    color: var(--blue);
    z-index: 200;
    animation: slideIn 0.3s ease;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

<!-- SVG defs for gradient -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#9b6dff"/>
    </linearGradient>
  </defs>
</svg>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box" id="login-box">
    <div class="login-logo">
      <div class="login-hexagon">
        <svg viewBox="0 0 56 56"><polygon class="hex-bg" points="28,4 50,16 50,40 28,52 6,40 6,16"/></svg>
        <span class="hex-inner">⬡</span>
      </div>
      <div class="login-title">AGENT ACCESS</div>
      <div class="login-sub">Secure · Intelligent · Free</div>
    </div>
    <div class="login-field">
      <label class="login-label">密码</label>
      <div class="login-input-wrap">
        <input class="login-input" id="login-pwd" type="password" placeholder="输入访问密码" autocomplete="off">
      </div>
    </div>
    <button class="login-btn" onclick="doLogin()">进入系统</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-success-msg" id="login-success">✓ 连接成功，正在进入...</div>
  </div>
</div>

<!-- MAIN APP -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div>
      <div class="logo-title">LANGRAPH AGENT</div>
      <div class="logo-sub">AI · Tools · LLM</div>
    </div>
  </div>
  <div class="header-right">
    <div class="free-badge">FREE</div>
    <div class="status-item">
      <div class="status-dot active" id="conn-dot"></div>
      <span id="conn-label">ONLINE</span>
    </div>
  </div>
</header>

<div class="app">
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-free">
          <div class="free-glow"></div>
          <div class="free-text">FREE</div>
        </div>
        <div class="free-tag">
          <span class="free-tag-dot"></span>
          智能 Agent · 多工具自动调用
        </div>
        <div class="welcome-title">智能 Agent 助手</div>
        <div class="welcome-sub">基于 Langraph搭建的assistant</div>
        <div class="suggestions">
          <div class="suggestion-chip" onclick="sendSuggestion(this)">现在几点了？</div>
          <div class="suggestion-chip" onclick="sendSuggestion(this)">计算 sin(45度) * sqrt(2)</div>
          <div class="suggestion-chip" onclick="sendSuggestion(this)">北京今天天气怎么样？</div>
          <div class="suggestion-chip" onclick="sendSuggestion(this)">100公里等于多少英里？</div>
          <div class="suggestion-chip" onclick="sendSuggestion(this)">2的10次方是多少？</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="输入问题，Agent 会自动选择合适的工具..."></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Enter 发送 · Shift+Enter 换行</span>
        <span class="input-hint" id="typing-count">0 字符</span>
      </div>
    </div>
  </div>

  <!-- 知识库侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>知识库</span>
      <button class="sidebar-btn" onclick="openCreateKbModal()">+ 新建</button>
    </div>
    <div class="sidebar-body" id="kb-list">
      <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:20px 0;">暂无知识库</div>
    </div>
    <div class="kb-active-bar" id="kb-active-bar" style="display:none">
      <div class="kb-active-dot"></div>
      <span id="kb-active-name">未选择</span>
      <span style="margin-left:auto;cursor:pointer;color:#ff5f7e;font-size:10px" onclick="clearActiveKb()">取消</span>
    </div>
  </div>
</div>

<!-- 新建知识库 Modal -->
<div class="modal-overlay" id="modal-create-kb">
  <div class="modal">
    <div class="modal-title">新建知识库</div>
    <input class="modal-input" id="kb-name-input" placeholder="知识库名称" />
    <input class="modal-input" id="kb-desc-input" placeholder="描述（可选）" />
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal('modal-create-kb')">取消</button>
      <button class="modal-confirm" onclick="createKb()">创建</button>
    </div>
  </div>
</div>

<!-- 添加文档 Modal -->
<div class="modal-overlay" id="modal-add-doc">
  <div class="modal">
    <div class="modal-title">添加文档到知识库</div>
    <textarea class="modal-input modal-textarea" id="doc-content-input" placeholder="粘贴文档内容..."></textarea>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal('modal-add-doc')">取消</button>
      <button class="modal-confirm" onclick="addDocument()">添加</button>
    </div>
  </div>
</div>


<script>
const SERVER_URL = 'http://localhost:8000';
let sessionId = 'session_' + Math.random().toString(36).substr(2, 8);
let msgCount = 0;
let isLoggedIn = false;
let activeKbId = null;
let addDocTargetKbId = null;

// ==================== 知识库管理 ====================

async function loadKbList() {
  try {
    const resp = await fetch(SERVER_URL + '/knowledge-base');
    const data = await resp.json();
    renderKbList(data.knowledge_bases);
  } catch(e) {}
}

function renderKbList(kbs) {
  const el = document.getElementById('kb-list');
  if (!kbs || kbs.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text-muted);text-align:center;padding:20px 0;">暂无知识库</div>';
    return;
  }
  el.innerHTML = kbs.map(kb => `
    <div class="kb-card ${activeKbId === kb.kb_id ? 'active' : ''}" onclick="selectKb('${kb.kb_id}','${kb.name}')">
      <div class="kb-card-name">${kb.name}</div>
      <div class="kb-card-meta">
        <span>${kb.description || '无描述'}</span>
        <span>${kb.doc_count} 篇文档</span>
      </div>
      <div class="kb-card-actions">
        <div class="kb-action-btn add" onclick="event.stopPropagation();openAddDocModal('${kb.kb_id}')">+ 添加文档</div>
        <div class="kb-action-btn del" onclick="event.stopPropagation();deleteKb('${kb.kb_id}')">删除</div>
      </div>
    </div>
  `).join('');
}

function selectKb(kbId, name) {
  activeKbId = activeKbId === kbId ? null : kbId;
  const bar = document.getElementById('kb-active-bar');
  if (activeKbId) {
    bar.style.display = 'flex';
    document.getElementById('kb-active-name').textContent = '已选: ' + name;
  } else {
    bar.style.display = 'none';
  }
  loadKbList();
}

function clearActiveKb() {
  activeKbId = null;
  document.getElementById('kb-active-bar').style.display = 'none';
  loadKbList();
}

function openCreateKbModal() {
  document.getElementById('kb-name-input').value = '';
  document.getElementById('kb-desc-input').value = '';
  document.getElementById('modal-create-kb').classList.add('open');
}

function openAddDocModal(kbId) {
  addDocTargetKbId = kbId;
  document.getElementById('doc-content-input').value = '';
  document.getElementById('modal-add-doc').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

async function createKb() {
  const name = document.getElementById('kb-name-input').value.trim();
  if (!name) return;
  const desc = document.getElementById('kb-desc-input').value.trim();
  await fetch(`${SERVER_URL}/knowledge-base?name=${encodeURIComponent(name)}&description=${encodeURIComponent(desc)}`, { method: 'POST' });
  closeModal('modal-create-kb');
  loadKbList();
}

async function addDocument() {
  const content = document.getElementById('doc-content-input').value.trim();
  if (!content || !addDocTargetKbId) return;
  await fetch(`${SERVER_URL}/knowledge-base/${addDocTargetKbId}/document`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content })
  });
  closeModal('modal-add-doc');
  loadKbList();
}

async function deleteKb(kbId) {
  if (!confirm('确认删除该知识库？')) return;
  await fetch(`${SERVER_URL}/knowledge-base/${kbId}`, { method: 'DELETE' });
  if (activeKbId === kbId) clearActiveKb();
  loadKbList();
}


// Login
function doLogin() {
  const pwd = document.getElementById('login-pwd').value;
  const errEl = document.getElementById('login-error');
  const successEl = document.getElementById('login-success');
  const box = document.getElementById('login-box');

  if (pwd === 'fuck') {
    errEl.textContent = '';
    box.classList.add('success');
    successEl.style.display = 'block';
    isLoggedIn = true;
    loadKbList();
    setTimeout(() => {
      document.getElementById('login-screen').style.opacity = '0';
      document.getElementById('login-screen').style.transition = 'opacity 0.5s ease';
      setTimeout(() => {
        document.getElementById('login-screen').style.display = 'none';
      }, 500);
    }, 900);
  } else {
    errEl.textContent = '密码错误，请重试';
    const input = document.getElementById('login-pwd');
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 600);
  }
}

document.getElementById('login-pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Auto-resize textarea
const textarea = document.getElementById('user-input');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  document.getElementById('typing-count').textContent = textarea.value.length + ' 字符';
});

textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage() {
  const input = textarea.value.trim();
  if (!input) return;

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  appendMessage('user', input);
  textarea.value = '';
  textarea.style.height = 'auto';
  document.getElementById('typing-count').textContent = '0 字符';
  document.getElementById('send-btn').disabled = true;

  const thinkingId = appendThinking();

  try {
    const resp = await fetch(SERVER_URL + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: input, session_id: sessionId, kb_id: activeKbId })
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || '请求失败');
    }

    const data = await resp.json();
    removeThinking(thinkingId);
    appendMessage('agent', data.response, data.steps);
    msgCount++;

  } catch (e) {
    removeThinking(thinkingId);
    appendMessage('agent', '⚠️ 错误: ' + e.message);
  }

  document.getElementById('send-btn').disabled = false;
  scrollToBottom();
}

function sendSuggestion(el) {
  textarea.value = el.textContent;
  sendMessage();
}

function appendMessage(role, text, steps) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message ' + role;

  const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const avatar = role === 'user' ? '👤' : '⬡';
  const label = role === 'user' ? 'YOU' : 'AGENT';

  div.innerHTML = `
    <div class="avatar ${role}">${avatar}</div>
    <div class="message-body">
      <div class="message-meta">${label} · ${time}</div>
      <div class="message-bubble">${escapeHtml(text)}</div>
    </div>
  `;

  container.appendChild(div);
  scrollToBottom();
}

function appendThinking() {
  const id = 'thinking-' + Date.now();
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = id;
  div.className = 'message agent';
  div.innerHTML = `
    <div class="avatar agent">⬡</div>
    <div class="message-body">
      <div class="message-meta">AGENT · 思考中</div>
      <div class="thinking">
        <span>处理中</span>
        <div class="thinking-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  container.appendChild(div);
  scrollToBottom();
  return id;
}

function removeThinking(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg, color) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  if (color === 'purple') toast.style.borderColor = 'var(--purple)', toast.style.color = 'var(--purple)';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}
</script>
</body>
</html>
